<!doctype html><html><head><meta charset="utf-8"><title>Timber drawing extraction methodology</title><style>body{margin:0;background:#e8edf3;padding:24px}svg{display:block;width:100%;max-width:1600px;height:auto;margin:auto;box-shadow:0 4px 25px #172b4518}@media print{body{padding:0;background:white}svg{box-shadow:none}}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1410" viewBox="0 0 1600 1410"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#63748b"/></marker></defs><rect width="1600" height="1410" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.title{font-size:32px;font-weight:700}.section{font-size:23px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.label{font-size:15px;font-weight:700;letter-spacing:1px}</style><text x="55" y="55" class="title" text-anchor="start">Structural information extraction from timber drawing sets</text><text x="55" y="89" class="body" text-anchor="start" style="fill:#596b81">Parallel, schema-guided interpretation with cross-sheet derivation and field-level uncertainty</text><rect x="40" y="120" width="1520" height="225" rx="10" fill="#f2f6fc" stroke="#d6dfeb" stroke-width="1.5"/><text x="60" y="153" class="section" text-anchor="start">01  Drawing input and task-specific extraction</text><rect x="65" y="178" width="300" height="136" rx="10" fill="#fff" stroke="#b9cce5" stroke-width="1.5"/><text x="215.0" y="208" class="head" text-anchor="middle">Drawing-set PDF</text><text x="215.0" y="237" class="body" text-anchor="middle">Plans, details and schedules</text><text x="215.0" y="262" class="body" text-anchor="middle">Sections and general notes</text><text x="215.0" y="287" class="body" text-anchor="middle">Independently drafted projects</text><path d="M365 246 H405" fill="none" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="415" y="178" width="1115" height="136" rx="10" fill="#ffffff" stroke="#91b3e2" stroke-width="1.5"/><text x="440" y="207" class="head" text-anchor="start">Seven concurrent VLM calls · shared drawing set · separate prompts and schemas</text><rect x="440" y="229" width="139" height="49" rx="10" fill="#e9f1fc" stroke="#9bb9e1" stroke-width="1.5"/><text x="509.5" y="260" class="body" text-anchor="middle">Roof</text><rect x="591" y="229" width="139" height="49" rx="10" fill="#e9f1fc" stroke="#9bb9e1" stroke-width="1.5"/><text x="660.5" y="260" class="body" text-anchor="middle">Floor</text><rect x="742" y="229" width="139" height="49" rx="10" fill="#e9f1fc" stroke="#9bb9e1" stroke-width="1.5"/><text x="811.5" y="260" class="body" text-anchor="middle">Footings</text><rect x="893" y="229" width="139" height="49" rx="10" fill="#e9f1fc" stroke="#9bb9e1" stroke-width="1.5"/><text x="962.5" y="260" class="body" text-anchor="middle">Posts</text><rect x="1044" y="229" width="139" height="49" rx="10" fill="#e9f1fc" stroke="#9bb9e1" stroke-width="1.5"/><text x="1113.5" y="260" class="body" text-anchor="middle">Walls</text><rect x="1195" y="229" width="139" height="49" rx="10" fill="#e9f1fc" stroke="#9bb9e1" stroke-width="1.5"/><text x="1264.5" y="260" class="body" text-anchor="middle">Shear walls</text><rect x="1346" y="229" width="139" height="49" rx="10" fill="#e9f1fc" stroke="#9bb9e1" stroke-width="1.5"/><text x="1415.5" y="260" class="body" text-anchor="middle">Project context</text><text x="440" y="301" class="small" text-anchor="start" style="fill:#596b81">Fixed pretrained model; no task-specific fine-tuning. Each call examines the non-MEP sheets.</text><path d="M973 314 V379" fill="none" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="365" width="1520" height="320" rx="10" fill="#f0f8f7" stroke="#bcded8" stroke-width="1.5"/><text x="60" y="403" class="section" text-anchor="start">02  Domain-guided interpretation within each call</text><text x="60" y="430" class="small" text-anchor="start" style="fill:#596b81">Prompt-directed procedures; compliance and source notes require independent verification.</text><rect x="65" y="452" width="330" height="155" rx="10" fill="#ffffff" stroke="#8fc6bb" stroke-width="1.5"/><text x="230.0" y="482" class="head" text-anchor="middle">Identify structural instances</text><text x="230.0" y="511" class="body" text-anchor="middle">Classify members and zones</text><text x="230.0" y="536" class="body" text-anchor="middle">Separate support-to-support spans</text><text x="230.0" y="561" class="body" text-anchor="middle">Distinguish tributary conditions</text><rect x="435" y="452" width="620" height="155" rx="10" fill="#ffffff" stroke="#8fc6bb" stroke-width="1.5"/><text x="745.0" y="482" class="head" text-anchor="middle">Resolve properties across sheets</text><text x="745.0" y="511" class="body" text-anchor="middle">Direct callouts → details / schedules → other sheets</text><text x="745.0" y="536" class="body" text-anchor="middle">Derive dimensions where evidence permits</text><text x="745.0" y="561" class="body" text-anchor="middle">Record source references, arithmetic and assumptions</text><rect x="1095" y="452" width="435" height="155" rx="10" fill="#ffffff" stroke="#8fc6bb" stroke-width="1.5"/><text x="1312.5" y="482" class="head" text-anchor="middle">Return structured member records</text><text x="1312.5" y="511" class="body" text-anchor="middle">Properties and geometric quantities</text><text x="1312.5" y="536" class="body" text-anchor="middle">Derivation notes and unresolved values</text><text x="1312.5" y="561" class="body" text-anchor="middle">Field-level uncertainty flags</text><path d="M395 527 H435" fill="none" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1055 527 H1095" fill="none" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/><text x="75" y="649" class="body" text-anchor="start" style="fill:#35685f">Examples: clear span · bearing length · tributary width / area · member size · material specification</text><path d="M1313 607 V705 H290 V742" fill="none" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="725" width="1520" height="215" rx="10" fill="#f6f3fb" stroke="#d9cbea" stroke-width="1.5"/><text x="60" y="761" class="section" text-anchor="start">03  Assemble and reconcile extracted records</text><rect x="65" y="781" width="450" height="133" rx="10" fill="#ffffff" stroke="#bfa8dc" stroke-width="1.5"/><text x="290.0" y="811" class="head" text-anchor="middle">Combine subsystem outputs</text><text x="290.0" y="840" class="body" text-anchor="middle">Retain member properties, notes and flags</text><text x="290.0" y="865" class="body" text-anchor="middle">Preserve raw extraction for evaluation</text><rect x="565" y="781" width="500" height="133" rx="10" fill="#ffffff" stroke="#bfa8dc" stroke-width="1.5"/><text x="815.0" y="811" class="head" text-anchor="middle">Reconcile selected cross-references</text><text x="815.0" y="840" class="body" text-anchor="middle">Footing ↔ wall / post; masonry ↔ shear-wall ID</text><text x="815.0" y="865" class="body" text-anchor="middle">Existing candidates only; reject low confidence</text><text x="815.0" y="890" class="body" text-anchor="middle">Record accepted label changes</text><rect x="1115" y="781" width="415" height="133" rx="10" fill="#ffffff" stroke="#bfa8dc" stroke-width="1.5"/><text x="1322.5" y="811" class="head" text-anchor="middle">Reviewable structured output</text><text x="1322.5" y="840" class="body" text-anchor="middle">Member and relationship records</text><text x="1322.5" y="865" class="body" text-anchor="middle">Original and reconciled versions</text><path d="M515 845 H565" fill="none" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1065 845 H1115" fill="none" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="970" width="1520" height="370" rx="10" fill="#fffcf5" stroke="#d8b874" stroke-width="1.5" stroke-dasharray="8 6"/><text x="60" y="1010" class="section" text-anchor="start">04  Proposed controlled evaluation</text><text x="1530" y="1008" class="label" text-anchor="end" style="fill:#99722d">STUDY PROTOCOL</text><rect x="65" y="1035" width="450" height="142" rx="10" fill="#ffffff" stroke="#d8c49c" stroke-width="1.5"/><text x="290.0" y="1065" class="head" text-anchor="middle">Independent reference annotations</text><text x="290.0" y="1094" class="body" text-anchor="middle">Annotate members, properties and geometry</text><text x="290.0" y="1119" class="body" text-anchor="middle">Record source ambiguity and plan complexity</text><text x="290.0" y="1144" class="body" text-anchor="middle">Prepare reference before reviewing outputs</text><rect x="565" y="1035" width="500" height="142" rx="10" fill="#ffffff" stroke="#d8c49c" stroke-width="1.5"/><text x="815.0" y="1065" class="head" text-anchor="middle">Same-model comparison</text><text x="815.0" y="1094" class="body" text-anchor="middle">Direct prompt → detailed single-call schema</text><text x="815.0" y="1119" class="body" text-anchor="middle">→ specialized extraction workflow</text><text x="815.0" y="1144" class="body" text-anchor="middle">Same held-out drawing sets and scoring rules</text><rect x="1115" y="1035" width="415" height="142" rx="10" fill="#ffffff" stroke="#d8c49c" stroke-width="1.5"/><text x="1322.5" y="1065" class="head" text-anchor="middle">Accuracy and review utility</text><text x="1322.5" y="1094" class="body" text-anchor="middle">Member precision / recall; field accuracy</text><text x="1322.5" y="1119" class="body" text-anchor="middle">Direct vs. derived quantity accuracy</text><text x="1322.5" y="1144" class="body" text-anchor="middle">Flag precision; missed and unflagged errors</text><path d="M515 1106 H565" fill="none" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1065 1106 H1115" fill="none" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1323 914 V1035" fill="none" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="65" y="1205" width="1465" height="100" rx="10" fill="#fff6df" stroke="#e3cc94" stroke-width="1.5"/><text x="85" y="1238" class="head" text-anchor="start">Auditable evaluation package</text><text x="85" y="1267" class="body" text-anchor="start">Save drawings, frozen prompts / schemas, raw outputs, reconciliation changes, manual markings and scores in a study folder.</text><text x="85" y="1291" class="small" text-anchor="start" style="fill:#6c6047">Assess extraction and flags separately; do not treat model-generated notes as verified evidence.</text><text x="55" y="1380" class="small" text-anchor="start" style="fill:#596b81">Solid panels: existing extraction workflow. Dashed panel: proposed study. No automated BIM or finite-element generation is claimed.</text></svg></body></html>
